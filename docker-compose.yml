version: "3.8"

# Bring up everything with one command: `docker compose up` (or `docker compose up --build` for the
# first run / after code changes). The api depends on bank_simulator and mongo via `depends_on`,
# so the supporting services start first; the api itself connects lazily (MongoClient + the typed
# HttpClient both defer their first I/O until a request lands), so the readiness of the
# dependencies doesn't have to be probed via healthchecks for the api to come up healthy.

services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  mongo:
    container_name: payment_gateway_mongo
    image: mongo:7
    ports:
      - "27017:27017"
    # No /data/db volume: the data dir is intentionally ephemeral, so every fresh container re-runs
    # the seed scripts (which only execute when /data/db is empty). Add a named volume here if you
    # need persistence — the seed is idempotent, so it stays safe if it re-runs.
    environment:
      # The seed scripts in /docker-entrypoint-initdb.d run against this database on first startup.
      MONGO_INITDB_DATABASE: payment_gateway
    volumes:
      - type: bind
        source: ./mongo-init
        target: /docker-entrypoint-initdb.d

  api:
    container_name: payment_gateway_api
    build:
      context: .
      dockerfile: src/PaymentGateway.Api/Dockerfile
    ports:
      # Host 5067 → container 8080. Matches launchSettings.json + the README's "How to call
      # the API" walkthrough, so a developer who already runs the API locally on 5067 sees the
      # same port when they switch to docker-compose up.
      - "5067:8080"
    environment:
      # In Docker the bank simulator and MongoDB are reachable at the compose service names
      # (not localhost). The env-var keys use `__` as the section separator to override the
      # matching appsettings.json values.
      BankSimulator__BaseUrl: http://bank_simulator:8080
      Mongo__ConnectionString: mongodb://mongo:27017
      ASPNETCORE_ENVIRONMENT: Production
      # Skip the Swagger UI in the containerised API — Swagger is a Development affordance,
      # not a production surface. The README's "How to call the API" walkthrough doesn't need it.
      Swagger__Enabled: "false"
    depends_on:
      - bank_simulator
      - mongo