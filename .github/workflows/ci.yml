name: CI

# Fast feedback for every push to main and every pull request: unit + architectural tests only.
# These don't need Mongo or Mountebank, so the workflow runs in ~1 min with no service
# containers. Integration + performance tests live in `.github/workflows/integration.yml` and
# run on a daily schedule + manual dispatch — they're slower (50-sequential + 50-concurrent HTTP
# calls in the perf step) and need ephemeral Mongo + Mountebank services, so they're off the
# PR critical path.
#
# Run this workflow manually via "Run workflow" when you want a quick rebuild-and-test without
# bringing up the integration services.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Don't run a second workflow against the same branch until the first one finishes (cancels
# the older one on a new push).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + Architectural
    runs-on: ubuntu-latest
    # No docker — purely source + xUnit. 5 min ceiling for headroom over the usual ~1 min.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Trait-based filter: only run tests NOT tagged [Trait("Category", "Integration")] and
      # NOT tagged [Trait("Category", "Performance")]. This is more robust than a namespace-based
      # filter because a test in any namespace can opt into the integration pipeline by adding
      # [Trait("Category", "Integration")] — useful when a test conceptually needs Mongo or the
      # bank simulator but lives in a "unit" folder for organizational reasons.
      - name: Run unit + architectural tests
        run: >-
          dotnet test --no-build -c Release
          --filter "Category!=Integration&Category!=Performance"
          --logger "console;verbosity=normal"
